<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WebGemini Affiliate System</title>
    <link rel="stylesheet" href="dashboard-style.css?v=2024.11.10">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-gem"></i>
                    <h1>WebGemini</h1>
                </div>
                <p>Affiliate System Login</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Username or Email
                    </label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username or email">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Login
                </button>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
            </form>

            <div class="login-footer">
                <p>New affiliate? <a href="#" id="showRegisterLink" class="register-link">Register here</a></p>
                <p><a href="#" id="showLoginLink" class="register-link" style="display: none;">Back to Login</a></p>
            </div>
        </div>
        
        <!-- Registration Form (Hidden by default) -->
        <div class="login-box" id="registerBox" style="display: none;">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-user-plus"></i>
                    <h1>WebGemini</h1>
                </div>
                <p>New Affiliate Registration</p>
            </div>

            <form id="registerForm" class="login-form">
                <div class="form-group">
                    <label for="reg_full_name">
                        <i class="fas fa-id-card"></i>
                        Full Name
                    </label>
                    <input type="text" id="reg_full_name" name="full_name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="reg_username">
                        <i class="fas fa-user"></i>
                        Username
                    </label>
                    <input type="text" id="reg_username" name="username" required placeholder="Choose a username (3-50 chars)">
                    <small style="color: #888; font-size: 12px;">Will be used in your coupon code</small>
                </div>

                <div class="form-group">
                    <label for="reg_email">
                        <i class="fas fa-envelope"></i>
                        Email Address
                    </label>
                    <input type="email" id="reg_email" name="email" required placeholder="Enter your email address">
                </div>

                <div class="form-group">
                    <label for="reg_password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <input type="password" id="reg_password" name="password" required placeholder="Enter password (min 8 characters)">
                </div>

                <div class="form-group">
                    <label for="reg_confirm_password">
                        <i class="fas fa-lock"></i>
                        Confirm Password
                    </label>
                    <input type="password" id="reg_confirm_password" name="confirm_password" required placeholder="Confirm your password">
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-user-plus"></i>
                    Register as Affiliate
                </button>

                <div id="registerErrorMessage" class="error-message" style="display: none;"></div>
                <div id="registerSuccessMessage" class="success-message" style="display: none;"></div>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a href="#" id="backToLoginLink" class="register-link">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        // API Configuration - Points to Render backend
        const API_BASE_URL = 'https://webgemini-affiliate-backend.onrender.com/api';

        // Toggle between login and register forms
        document.getElementById('showRegisterLink').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('.login-box:first-of-type').style.display = 'none';
            document.getElementById('registerBox').style.display = 'block';
        });

        document.getElementById('showLoginLink').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('.login-box:first-of-type').style.display = 'block';
            document.getElementById('registerBox').style.display = 'none';
        });

        document.getElementById('backToLoginLink').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('.login-box:first-of-type').style.display = 'block';
            document.getElementById('registerBox').style.display = 'none';
        });

        // Login Form Handler - Production Mode
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorMessage = document.getElementById('errorMessage');
            
            // Hide previous error messages
            errorMessage.style.display = 'none';
            
            // Real server login
            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password, rememberMe })
                });

                const data = await response.json();

                if (response.status === 429) {
                    // Rate limit exceeded
                    errorMessage.innerHTML = '⚠️ Too many login attempts. Please wait 15 minutes and try again.';
                    errorMessage.style.display = 'block';
                    return;
                }

                if (data.success) {
                    // Store token
                    localStorage.setItem('authToken', data.token);
                    
                    // Clear any old mock data
                    localStorage.removeItem('mockUser');
                    
                    // Redirect based on role
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'affiliate-dashboard.html';
                    }
                } else {
                    errorMessage.textContent = data.message || 'Login failed. Please check your credentials.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.innerHTML = '⚠️ Connection error. Please check your internet connection and try again.';
                errorMessage.style.display = 'block';
            }
        });

        // Registration Form Handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('reg_full_name').value;
            const username = document.getElementById('reg_username').value;
            const email = document.getElementById('reg_email').value;
            const password = document.getElementById('reg_password').value;
            const confirmPassword = document.getElementById('reg_confirm_password').value;
            const errorMessage = document.getElementById('registerErrorMessage');
            const successMessage = document.getElementById('registerSuccessMessage');
            
            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Validate password length
            if (password.length < 8) {
                errorMessage.textContent = 'Password must be at least 8 characters';
                errorMessage.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/register-affiliate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        full_name: fullName,
                        username,
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    successMessage.textContent = `Registration successful! Your coupon code is: ${data.coupon_code}. Redirecting to login...`;
                    successMessage.style.display = 'block';
                    
                    // Clear form
                    document.getElementById('registerForm').reset();
                    
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        document.querySelector('.login-box:first-of-type').style.display = 'block';
                        document.getElementById('registerBox').style.display = 'none';
                        const loginSuccessMsg = document.getElementById('successMessage');
                        loginSuccessMsg.textContent = 'Registration successful! Please login with your credentials.';
                        loginSuccessMsg.style.display = 'block';
                    }, 3000);
                } else {
                    errorMessage.textContent = data.message || 'Registration failed';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Registration error:', error);
                errorMessage.textContent = 'Connection error. Please make sure the server is running.';
                errorMessage.style.display = 'block';
            }
        });

        // Check if already logged in
        const token = localStorage.getItem('authToken');
        if (token && !token.startsWith('mock-')) {
            // Verify token with server
            fetch(`${API_BASE_URL}/auth/verify`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'affiliate-dashboard.html';
                    }
                }
            })
            .catch(err => {
                console.log('Not logged in or token expired');
                localStorage.removeItem('authToken');
            });
        } else if (token && token.startsWith('mock-')) {
            // Clear old mock tokens
            localStorage.removeItem('authToken');
            localStorage.removeItem('mockUser');
        }
    </script>
</body>
</html>
