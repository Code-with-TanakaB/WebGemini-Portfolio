<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="favicon-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="favicon-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="200" height="200" fill="#1a1a2e"/>
    
    <!-- Simplified Faceted Gem - optimized for small sizes -->
    <polygon points="100,50 140,95 100,80 60,95" fill="url(#favicon-grad-1)" opacity="0.95"/>
    <polygon points="60,95 100,80 100,150 40,150" fill="url(#favicon-grad-1)" opacity="0.85"/>
    <polygon points="140,95 160,150 100,150 100,80" fill="url(#favicon-grad-2)" opacity="0.9"/>
    
    <!-- Top shine -->
    <line x1="70" y1="70" x2="130" y2="70" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Code brackets - prominent for recognition -->
    <path d="M 75 100 L 65 110 L 75 120" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 125 100 L 135 110 L 125 120" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>