<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- CONCEPT 1: Faceted Digital Gemstone -->
  <!-- Main Diamond/Gem Shape with Code Integration -->
  
  <!-- Top Facet -->
  <polygon points="100,40 130,75 100,65 70,75" fill="url(#grad1)" opacity="0.95"/>
  
  <!-- Left Facet -->
  <polygon points="70,75 100,65 100,100 55,100" fill="url(#grad1)" opacity="0.85"/>
  
  <!-- Right Facet -->
  <polygon points="130,75 145,100 100,100 100,65" fill="url(#grad2)" opacity="0.9"/>
  
  <!-- Bottom Left -->
  <polygon points="55,100 100,100 100,160" fill="url(#grad1)" opacity="0.75"/>
  
  <!-- Bottom Right -->
  <polygon points="145,100 100,160 100,100" fill="url(#grad2)" opacity="0.8"/>
  
  <!-- Center Highlight (gem shine) -->
  <polygon points="100,65 110,85 100,100 90,85" fill="#FFFFFF" opacity="0.25"/>
  
  <!-- Code Brackets integrated -->
  <path d="M 75 85 L 68 92 L 75 99" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 125 85 L 132 92 L 125 99" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Twin/Gemini dual lines -->
  <line x1="95" y1="75" x2="95" y2="120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  <line x1="105" y1="75" x2="105" y2="120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Shine effect -->
  <line x1="100" y1="40" x2="100" y2="55" stroke="#FFFFFF" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
  
  <!-- Connectivity nodes -->
  <circle cx="100" cy="25" r="2.5" fill="url(#grad2)" opacity="0.6"/>
  <circle cx="160" cy="100" r="2.5" fill="url(#grad2)" opacity="0.6"/>
  <circle cx="100" cy="175" r="2.5" fill="url(#grad2)" opacity="0.6"/>
  <circle cx="40" cy="100" r="2.5" fill="url(#grad2)" opacity="0.6"/>
</svg>