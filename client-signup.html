<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Signup - WebGemini</title>
    <link rel="stylesheet" href="dashboard-style.css">
    <style>
        .signup-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .signup-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .signup-header h1 {
            color: #1e293b;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .signup-header p {
            color: #64748b;
        }

        .signup-form {
            display: grid;
            gap: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group label {
            display: block;
            color: #334155;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            color: #1e293b;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .coupon-input-group {
            position: relative;
        }

        .verify-coupon-btn {
            position: absolute;
            right: 5px;
            top: 5px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .coupon-status {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .coupon-status.valid {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .coupon-status.invalid {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .submit-btn {
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .success-message,
        .error-message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="signup-page">
    <div class="signup-container">
        <div class="signup-header">
            <h1>Sign Up for WebGemini</h1>
            <p>Start your journey with our web services</p>
        </div>

        <form id="signupForm" class="signup-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="planType">Plan Type *</label>
                    <select id="planType" name="planType" required>
                        <option value="">Select a plan</option>
                        <option value="Starter">Starter Plan - $299</option>
                        <option value="Basic">Basic Plan - $499</option>
                        <option value="Pro">Pro Plan - $999</option>
                        <option value="Premium">Premium Plan - $1,499</option>
                        <option value="Enterprise">Enterprise Plan - $2,999</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="planPrice">Plan Price *</label>
                    <input type="number" id="planPrice" name="planPrice" required readonly placeholder="Select plan first">
                </div>
            </div>

            <div class="form-group">
                <label for="couponCode">Coupon Code (Optional)</label>
                <div class="coupon-input-group">
                    <input type="text" id="couponCode" name="couponCode" placeholder="Enter referral coupon code" style="padding-right: 100px;">
                    <button type="button" class="verify-coupon-btn" id="verifyCouponBtn">Verify</button>
                </div>
                <div id="couponStatus" class="coupon-status"></div>
            </div>

            <button type="submit" class="submit-btn">Complete Signup</button>

            <div id="successMessage" class="success-message"></div>
            <div id="errorMessage" class="error-message"></div>
        </form>
    </div>

    <script>
        const API_BASE_URL = window.location.origin.includes('github.dev') 
            ? `${window.location.origin}/api`
            : 'http://localhost:3001/api';
        let isCouponValid = false;
        let validatedCoupon = null;

        // Plan prices mapping
        const planPrices = {
            'Starter': 299,
            'Basic': 499,
            'Pro': 999,
            'Premium': 1499,
            'Enterprise': 2999
        };

        // Update plan price when plan is selected
        document.getElementById('planType').addEventListener('change', (e) => {
            const planType = e.target.value;
            const priceInput = document.getElementById('planPrice');
            
            if (planType && planPrices[planType]) {
                priceInput.value = planPrices[planType];
            } else {
                priceInput.value = '';
            }
        });

        // Verify coupon code
        document.getElementById('verifyCouponBtn').addEventListener('click', async () => {
            const couponCode = document.getElementById('couponCode').value.trim();
            const statusDiv = document.getElementById('couponStatus');

            if (!couponCode) {
                statusDiv.className = 'coupon-status invalid';
                statusDiv.textContent = 'Please enter a coupon code';
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/affiliates/verify-coupon`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ coupon_code: couponCode })
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.className = 'coupon-status valid';
                    statusDiv.textContent = `✓ Valid coupon! Referred by ${data.affiliate_name}`;
                    isCouponValid = true;
                    validatedCoupon = couponCode;
                } else {
                    statusDiv.className = 'coupon-status invalid';
                    statusDiv.textContent = '✗ Invalid coupon code';
                    isCouponValid = false;
                    validatedCoupon = null;
                }
            } catch (error) {
                console.error('Error verifying coupon:', error);
                statusDiv.className = 'coupon-status invalid';
                statusDiv.textContent = '✗ Error verifying coupon. Please try again.';
            }
        });

        // Handle form submission
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                plan_type: document.getElementById('planType').value,
                plan_price: parseFloat(document.getElementById('planPrice').value),
                coupon_code: document.getElementById('couponCode').value.trim() || null
            };

            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');

            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/affiliates/track-signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    successMsg.textContent = `🎉 ${data.message}${data.affiliate ? ' Referred by ' + data.affiliate + '!' : ''}`;
                    successMsg.style.display = 'block';
                    document.getElementById('signupForm').reset();
                    document.getElementById('couponStatus').style.display = 'none';
                    
                    // Scroll to success message
                    successMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    errorMsg.textContent = data.message || 'Signup failed. Please try again.';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Signup error:', error);
                errorMsg.textContent = 'Connection error. Please make sure the server is running and try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
