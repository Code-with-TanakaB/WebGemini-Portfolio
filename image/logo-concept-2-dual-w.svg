<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-dual" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- CONCEPT 2: Mirrored W/W forming Gemini symbol with Digital Connection -->
  
  <!-- Left W (mirrored) -->
  <path d="M 50 70 L 60 120 L 70 90 L 80 120 L 90 70" 
        stroke="url(#grad-dual)" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.9"/>
  
  <!-- Right W (normal) -->
  <path d="M 110 70 L 120 120 L 130 90 L 140 120 L 150 70" 
        stroke="url(#grad-dual)" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.9"/>
  
  <!-- Connection bridge (partnership/duality) -->
  <circle cx="100" cy="95" r="6" fill="#3B82F6" opacity="0.8"/>
  
  <!-- Digital grid pattern overlay -->
  <line x1="60" y1="75" x2="140" y2="75" stroke="#60A5FA" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="60" y1="90" x2="140" y2="90" stroke="#60A5FA" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  <line x1="60" y1="105" x2="140" y2="105" stroke="#60A5FA" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
  
  <!-- Gemini constellation dots -->
  <circle cx="70" cy="55" r="3" fill="#93C5FD" opacity="0.7"/>
  <circle cx="130" cy="55" r="3" fill="#93C5FD" opacity="0.7"/>
  <line x1="70" y1="55" x2="130" y2="55" stroke="#93C5FD" stroke-width="1" opacity="0.4"/>
  
  <!-- Subtle geometric frame -->
  <rect x="45" y="50" width="110" height="85" rx="4" fill="none" stroke="#1E3A8A" stroke-width="1.5" opacity="0.2"/>
</svg>