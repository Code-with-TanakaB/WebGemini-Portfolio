<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- CONCEPT 3: WG Lettermark - Interlocked with Geometric Precision -->
  
  <!-- Hexagonal gem container -->
  <polygon points="100,50 140,75 140,125 100,150 60,125 60,75" 
           fill="none" 
           stroke="url(#wg-grad)" 
           stroke-width="2.5" 
           opacity="0.4"/>
  
  <!-- W integrated into left side -->
  <path d="M 70 80 L 75 110 L 82 92 L 89 110 L 94 80" 
        stroke="url(#wg-grad)" 
        stroke-width="7" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- G integrated into right side -->
  <path d="M 130 90 A 15 15 0 1 0 130 110" 
        stroke="url(#wg-grad)" 
        stroke-width="7" 
        fill="none" 
        stroke-linecap="round"/>
  <line x1="130" y1="100" x2="118" y2="100" 
        stroke="url(#wg-grad)" 
        stroke-width="7" 
        stroke-linecap="round"/>
  
  <!-- Circuit-like connections -->
  <circle cx="82" cy="100" r="3" fill="#3B82F6"/>
  <circle cx="118" cy="100" r="3" fill="#3B82F6"/>
  <line x1="82" y1="100" x2="118" y2="100" stroke="#60A5FA" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Corner nodes (web connectivity) -->
  <circle cx="100" cy="50" r="4" fill="#93C5FD" opacity="0.6"/>
  <circle cx="140" cy="100" r="4" fill="#93C5FD" opacity="0.6"/>
  <circle cx="100" cy="150" r="4" fill="#93C5FD" opacity="0.6"/>
  <circle cx="60" cy="100" r="4" fill="#93C5FD" opacity="0.6"/>
</svg>