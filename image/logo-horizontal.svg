<svg viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradientPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Compact Gem Logo Mark -->
  <g>
    <!-- Faceted Gem -->
    <polygon points="40,25 55,45 40,40 25,45" fill="url(#gradientPrimary)" opacity="0.95"/>
    <polygon points="25,45 40,40 40,60 15,60" fill="url(#gradientPrimary)" opacity="0.85"/>
    <polygon points="55,45 65,60 40,60 40,40" fill="url(#gradientAccent)" opacity="0.9"/>
    <polygon points="15,60 40,60 40,95" fill="url(#gradientPrimary)" opacity="0.75"/>
    <polygon points="65,60 40,95 40,60" fill="url(#gradientAccent)" opacity="0.8"/>
    
    <!-- Gem shine -->
    <polygon points="40,40 44,50 40,60 36,50" fill="#FFFFFF" opacity="0.2"/>
    
    <!-- Code brackets -->
    <path d="M 30 50 L 26 55 L 30 60" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M 50 50 L 54 55 L 50 60" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Twin lines -->
    <line x1="38" y1="45" x2="38" y2="75" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
    <line x1="42" y1="45" x2="42" y2="75" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
  </g>
  
  <!-- Company Name -->
  <text x="90" y="75" font-family="'Plus Jakarta Sans', 'Inter', Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="2">
    <tspan fill="#1E3A8A">WEB</tspan><tspan fill="#3B82F6">GEMINI</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="90" y="98" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0.8" fill="#4B5563">
    Precision Digital Craftsmanship
  </text>
</svg>