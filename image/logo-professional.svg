<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradientPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
    </linearGradient>
    <filter id="shine" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  
  <!-- Faceted Gemstone with Digital Elements -->
  <g filter="url(#shine)">
    <!-- Main Diamond/Gem Shape -->
    <!-- Top Facet -->
    <polygon points="100,40 130,75 100,65 70,75" fill="url(#gradientPrimary)" opacity="0.95"/>
    
    <!-- Left Facet -->
    <polygon points="70,75 100,65 100,100 55,100" fill="url(#gradientPrimary)" opacity="0.85"/>
    
    <!-- Right Facet -->
    <polygon points="130,75 145,100 100,100 100,65" fill="url(#gradientAccent)" opacity="0.9"/>
    
    <!-- Bottom Left -->
    <polygon points="55,100 100,100 100,160" fill="url(#gradientPrimary)" opacity="0.75"/>
    
    <!-- Bottom Right -->
    <polygon points="145,100 100,160 100,100" fill="url(#gradientAccent)" opacity="0.8"/>
    
    <!-- Center Highlight (gem shine) -->
    <polygon points="100,65 110,85 100,100 90,85" fill="#93C5FD" opacity="0.4"/>
    
    <!-- Digital/Code Elements Overlaid on Gem -->
    <!-- Code Brackets integrated into facets -->
    <path d="M 75 85 L 68 92 L 75 99" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 125 85 L 132 92 L 125 99" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Twin/Gemini Elements - Dual Lines -->
    <line x1="95" y1="75" x2="95" y2="120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
    <line x1="105" y1="75" x2="105" y2="120" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Top shine lines -->
    <line x1="100" y1="40" x2="100" y2="55" stroke="#FFFFFF" stroke-width="2" opacity="0.8" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle outer ring suggesting connectivity -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#gradientPrimary)" stroke-width="1" opacity="0.2"/>
  
  <!-- Connection nodes at cardinal points (web connectivity) -->
  <circle cx="100" cy="25" r="3" fill="url(#gradientAccent)" opacity="0.6"/>
  <circle cx="175" cy="100" r="3" fill="url(#gradientAccent)" opacity="0.6"/>
  <circle cx="100" cy="175" r="3" fill="url(#gradientAccent)" opacity="0.6"/>
  <circle cx="25" cy="100" r="3" fill="url(#gradientAccent)" opacity="0.6"/>
</svg>