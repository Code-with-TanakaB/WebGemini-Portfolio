<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="favicon-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="favicon-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Background for small size visibility -->
    <rect width="200" height="200" fill="#0f172a"/>
    
    <!-- REFINED FACETED GEMSTONE (optimized for favicon) -->
    <!-- Top Crown Facet -->
    <polygon points="100,35 125,65 75,65" fill="url(#favicon-grad-1)" opacity="0.98"/>
    
    <!-- Upper Left Facet -->
    <polygon points="75,65 100,50 130,85 105,100" fill="url(#favicon-grad-1)" opacity="0.92"/>
    
    <!-- Upper Right Facet -->
    <polygon points="125,65 150,85 125,100 100,50" fill="url(#favicon-grad-2)" opacity="0.95"/>
    
    <!-- Middle Left Facet -->
    <polygon points="75,65 105,100 65,115" fill="url(#favicon-grad-1)" opacity="0.85"/>
    
    <!-- Middle Right Facet -->
    <polygon points="125,100 150,85 160,115" fill="url(#favicon-grad-2)" opacity="0.88"/>
    
    <!-- Bottom Left Facet -->
    <polygon points="65,115 105,100 100,155" fill="url(#favicon-grad-1)" opacity="0.78"/>
    
    <!-- Bottom Right Facet -->
    <polygon points="105,100 160,115 125,155" fill="url(#favicon-grad-2)" opacity="0.82"/>
    
    <!-- Bottom Point -->
    <polygon points="100,155 125,155 112,175" fill="url(#favicon-grad-1)" opacity="0.72"/>
    
    <!-- TOP SHINE -->
    <line x1="95" y1="40" x2="105" y2="40" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" stroke-linecap="round"/>
    
    <!-- CODE BRACKETS -->
    <path d="M 70 90 Q 60 100 70 110" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M 130 90 Q 140 100 130 110" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    
    <!-- TWIN PARALLEL LINES (Gemini) -->
    <line x1="96" y1="65" x2="96" y2="145" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4"/>
    <line x1="104" y1="65" x2="104" y2="145" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4"/>
</svg>