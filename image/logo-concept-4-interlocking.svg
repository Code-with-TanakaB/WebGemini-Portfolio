<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="link-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- CONCEPT 4: Interlocking Dual Elements (Partnership/Twins) -->
  
  <!-- Left circle/element -->
  <circle cx="80" cy="100" r="35" fill="none" stroke="url(#link-grad)" stroke-width="6" opacity="0.8"/>
  
  <!-- Right circle/element -->
  <circle cx="120" cy="100" r="35" fill="none" stroke="url(#link-grad)" stroke-width="6" opacity="0.8"/>
  
  <!-- Intersection highlight (the 'link') -->
  <path d="M 100 70 A 35 35 0 0 0 100 130" fill="#3B82F6" opacity="0.3"/>
  
  <!-- Digital code brackets inside intersection -->
  <path d="M 95 85 L 90 100 L 95 115" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 105 85 L 110 100 L 105 115" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Gemini parallel lines through center -->
  <line x1="97" y1="75" x2="97" y2="125" stroke="#60A5FA" stroke-width="1" opacity="0.4"/>
  <line x1="103" y1="75" x2="103" y2="125" stroke="#60A5FA" stroke-width="1" opacity="0.4"/>
  
  <!-- Connection nodes -->
  <circle cx="80" cy="65" r="4" fill="#93C5FD"/>
  <circle cx="120" cy="65" r="4" fill="#93C5FD"/>
  <circle cx="80" cy="135" r="4" fill="#93C5FD"/>
  <circle cx="120" cy="135" r="4" fill="#93C5FD"/>
  
  <!-- Outer precision frame -->
  <rect x="40" y="60" width="120" height="80" rx="6" fill="none" stroke="#1E3A8A" stroke-width="1" opacity="0.15"/>
</svg>